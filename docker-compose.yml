# Sem "ports" e sem "container_name" de propósito: o Easypanel publica só o app
# (porta 3100) por domínio com HTTPS. Para rodar local, use também docker-compose.local.yml.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    depends_on: [postgres, redis]
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ana?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ana
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ana"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app:
    build: ./app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ana
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_URL: http://evolution:8080

  backup:
    build: ./backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Destino rclone, ex.: gdrive:ana-backups (remote "gdrive" configurado abaixo)
      BACKUP_DESTINO: ${BACKUP_DESTINO}
      RCLONE_CONFIG_GDRIVE_TYPE: ${RCLONE_CONFIG_GDRIVE_TYPE:-drive}
      RCLONE_CONFIG_GDRIVE_SCOPE: ${RCLONE_CONFIG_GDRIVE_SCOPE:-drive.file}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_CONFIG_GDRIVE_TOKEN:-}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${RCLONE_CONFIG_GDRIVE_CLIENT_ID:-}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${RCLONE_CONFIG_GDRIVE_CLIENT_SECRET:-}

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
